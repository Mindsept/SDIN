name: Repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.10.0'
      - name: Install pinned documentation parsers
        run: python3 -m pip install --disable-pip-version-check -r ci/requirements.txt
      - name: Syntax and isolated behavior checks
        run: bash ci/check.sh
      - name: Lint the migrated lifecycle scripts
        run: shellcheck -S warning ci/check.sh ci/install-gitleaks.sh td/core-platform/lifecycle.sh td/core-platform/templates/app-lifecycle.sh
      - name: Validate GitHub workflows and the app template
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -config-file .github/actionlint.yaml -shellcheck='' .github/workflows/*.yml td/core-platform/templates/github-actions.yml
