name: Core platform
on:
  workflow_dispatch:
    inputs:
      action:
        description: Platform action
        type: choice
        options: [start, stop, purge]
        default: start
        required: true
      confirm_purge:
        description: For purge only, enter core (deletes shared volumes)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: sdi-platform
  cancel-in-progress: false
jobs:
  lifecycle:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, linux, sdi-workshop]
    environment: sdi-workshop
    timeout-minutes: 30
    steps:
      # Dedicated trusted operations checkout; runtime APISIX config is mounted here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: false
          persist-credentials: false
      - name: Operate the existing workshop platform
        working-directory: td/core-platform
        env:
          ACTION: ${{ inputs.action }}
          CONFIRM_PURGE: ${{ inputs.confirm_purge }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: ./lifecycle.sh "$ACTION"
